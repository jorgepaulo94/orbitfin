name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Chave descartável, só para o CI. A chave de verdade fica no seu .env local.
      SECRET_KEY: ci-chave-descartavel-so-para-testes-0123456789
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Aplicar migrações
        run: alembic upgrade head

      - name: Conferir se modelos e migrações estão alinhados
        run: alembic check

      - name: Rodar os testes
        run: python -m pytest -q

      


        